name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  engine:
    name: Engine tests + synthetic eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Engine + agekt unit tests
        run: ./gradlew :engine:test :agekt:test :engine:cliJar --no-daemon
      - name: Guard set (must never regress)
        run: python3 -I eval/guard.py --engine jar:engine/build/libs/engine-cli.jar --out eval/out/guard.json
      - name: Synthetic eval
        run: python3 -I eval/run_eval.py --synthetic --engine jar:engine/build/libs/engine-cli.jar --out eval/out/ci
      - name: Promotion check against baseline
        run: |
          if [ -f eval/baseline/metrics.json ]; then
            python3 -I eval/promote.py --baseline eval/baseline/metrics.json --candidate eval/out/ci/metrics.json --guard eval/out/guard.json --max-p95-ms 120 --max-cost-per-1k 0.02 --min-words 500
          else
            echo "no baseline yet; skipping promotion check"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval
          path: |
            eval/out/**/metrics.json
            eval/out/**/table.txt
            eval/out/guard.json
            engine/build/reports/tests

  apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Decode signing keystore
        if: ${{ secrets.SLOPTYPE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SLOPTYPE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sloptype-release.jks"
          echo "SLOPTYPE_KEYSTORE=$RUNNER_TEMP/sloptype-release.jks" >> "$GITHUB_ENV"
          echo "SLOPTYPE_KEYSTORE_PASSWORD=${{ secrets.SLOPTYPE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SLOPTYPE_KEY_ALIAS=${{ secrets.SLOPTYPE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SLOPTYPE_KEY_PASSWORD=${{ secrets.SLOPTYPE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Read version
        id: ver
        run: |
          v=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          ls -la app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: SlopType-release
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release (main only, new version only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; skipping (bump versionName to publish)"
            exit 0
          fi
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          notes="Automated build of $GITHUB_SHA. Engine config and router weights live in slop-type-data; this release only changes code."
          gh release create "$tag" "$apk" --title "Slop Type $VERSION" --notes "$notes"
